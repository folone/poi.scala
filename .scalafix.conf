rules = [
  DisableSyntax,
  LeakingImplicitClassVal,
  NoValInForComprehension,
  ProcedureSyntax,
  RemoveUnused
]

DisableSyntax.noVars = false // mutable builder/async state used throughout (DataValidation, NamedRange, AsyncOperations)
DisableSyntax.noThrows = false // addRowsInBulk returns Workbook (not Either); impure API throws by design
DisableSyntax.noNulls = false // Apache POI Java API returns null (getSheetAt/getRow/getCell); null checks required for interop
DisableSyntax.noReturns = false // early-exit guard in async backpressure processor
DisableSyntax.noWhileLoops = false
DisableSyntax.noAsInstanceOf = false
DisableSyntax.noIsInstanceOf = false
DisableSyntax.noXml = true
DisableSyntax.noDefaultArgs = false
DisableSyntax.noFinalVal = true
DisableSyntax.noFinalize = true

RemoveUnused.imports = false
RemoveUnused.privates = true
RemoveUnused.locals = true
RemoveUnused.patternvars = true
